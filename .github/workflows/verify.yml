name: Verify
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '.config/dotnet-tools.json'
      - '.csharpierrc'
      - '.csharpierignore'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '.config/dotnet-tools.json'
      - '.csharpierrc'
      - '.csharpierignore'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions: 
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/Atomizer.Dashboard/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/Atomizer.Dashboard/frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            6.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release --verbosity minimal

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release --collect:"XPlat Code Coverage" --logger "trx" --results-directory ./TestResults
        
      - name: Test results report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Test Results
          path: ./TestResults/**/*.trx
          reporter: dotnet-trx
          
      - name: Code coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: ${{ !cancelled() }}
        with:
          filename: ./TestResults/*/coverage.cobertura.xml
          format: 'markdown'
          output: 'both'
          badge: true
          hide_branch_rate: true
          hide_complexity: true
          
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
